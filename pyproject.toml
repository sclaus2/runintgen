[build-system]
requires = [
    "scikit-build-core>=0.10",
    "nanobind>=2.0",
    "numpy",
    "cffi",
]
build-backend = "scikit_build_core.build"

[project]
name = "runintgen"
version = "0.1.0"
description = "Runtime integration kernel generator for FEniCSx/FFCx"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
authors = [
    {name = "Runintgen Developers"}
]
dependencies = [
    "numpy",
    "fenics-basix>=0.11.0,<0.12.0",
    "fenics-ufl>=2026.1.0,<2026.2.0",
    "fenics-ffcx>=0.11.0,<0.12.0",
]

[project.optional-dependencies]
dev = [
    "setuptools",
    "wheel",
    "pytest",
    "pytest-cov",
    "ruff",
]

[tool.scikit-build]
wheel.packages = ["runintgen"]
wheel.license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
]
sdist.include = [
    "CMakeLists.txt",
    "THIRD_PARTY_NOTICES.md",
    "runintgen/cpp/*.h",
    "runintgen/cpp/*.cpp",
]
sdist.exclude = [
    ".pytest_cache/",
    ".ruff_cache/",
    "generated/",
    "*.egg-info/",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
